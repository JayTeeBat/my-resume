# Variant definitions.
#
# Each [section] declares one output cut, built from the single resume.json.
# `include` lists the x-tags an entry needs to survive into this variant.
#
# Filtering rule:
#   - an entry with NO "x-tags" key is ALWAYS included (untagged == core content)
#   - an entry WITH "x-tags" survives only if one of its tags is in `include`
#   - include = ["*"] includes everything
#
# So you only tag entries you want to *conditionally* drop.
#
# `publish` controls what `resume site` puts on the public GitHub Pages page.
# It defaults to false, so a new cut — e.g. a CV tailored to one employer — is
# never published by accident. Only variants with publish = true go public.
# `resume build` ignores this flag: you can always build any variant locally.
#
# Order matters for the site: the first published variant is the primary cut,
# shown first on the landing page and served as /resume.json; the others
# follow as alternatives.
#
# Tags in use: "full" marks entries only the complete CV keeps; "2-page" marks
# entries the two-page cut keeps but the one-page cut drops.

[2-page]
description = "Two-page CV, older and niche entries dropped"
include = ["2-page"]
publish = true

[one-page]
description = "One-page CV, the strongest and most quantified points"
include = []
publish = true

[one-page.style]
"--size-base" = "9pt"
"--leading" = "1.2"
"--section-gap" = "3pt"
"--entry-gap" = "1.5pt"
"--heading-gap" = "2pt"
"--heading-padding" = "1.5pt"
"--role-gap" = "1.5pt"
"--summary-gap" = "1pt"
"--highlights-gap" = "1pt"
"--bullet-gap" = "0pt"
"--skills-gap" = "1pt"
"--size-company" = "9.6pt"
"--size-title" = "9.2pt"
"--size-meta" = "8pt"

[full]
description = "Complete CV, every entry"
include = ["*"]
publish = true
