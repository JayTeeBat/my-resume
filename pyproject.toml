[project]
name = "my-resume"
version = "0.0.0"
description = "Jacques Thomazo's CV as JSON Resume content, rendered by resume-toolkit"
readme = "README.md"
authors = [
    { name = "Jacques Thomazo", email = "jacques.thomazo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "resume-toolkit @ git+https://github.com/JayTeeBat/resume-toolkit@551579933b46babf58bd9d48f48a62fe100b9af2",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.0.0",
    "pre-commit-hooks>=5.0.0",
    "pymarkdownlnt>=0.9.39",
]

[tool.uv]
# Content only: nothing here is built or installed as a package.
package = false

[tool.codespell]
# Generated or vendored files are not ours to spell-check.
skip = "./.git,./.venv,./dist,./uv.lock"
