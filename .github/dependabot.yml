version: 2

# One pull request per week for the whole repository: both ecosystems feed a
# single multi-ecosystem group, which owns the schedule.
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
  # uv.lock: the toolkit pin, dev tools and their transitive dependencies.
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
