name: Quality

# Triggers match repo-standard-kit's quality workflow (push to main, every
# pull request). workflow_dispatch is a deliberate addition: it re-runs the
# gates and redeploys Pages from the Actions tab without a commit.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the colophon dates the CV from the last commit that
          # touched resume.json. The default shallow clone fetches one commit,
          # so that lookup would silently fall back to whatever HEAD is and
          # stamp every build with today's date -- wrong, and wrong quietly.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check standards pins
        run: |
          uv run python - <<'PYTHON'
          import json, re, tomllib
          from pathlib import Path
          register = Path("docs/standards.md").read_text()
          row = next(line for line in register.splitlines() if "| JSON Resume |" in line)
          dependency = tomllib.loads(Path("pyproject.toml").read_text())["project"]["dependencies"][0]
          pin = dependency.rsplit("@", 1)[1]
          assert "toolkit v0.2.0" in row and (pin == "v0.2.0" or re.fullmatch(r"[a-f0-9]{40}", pin)), "toolkit pin drift"
          schema = json.loads(Path("resume.json").read_text())["$schema"]
          assert schema.split("/")[-2] in row, "schema pin drift"
          kit_row = next(line for line in register.splitlines() if "| repo-standard-kit |" in line)
          pins = [pin for path in Path(".").rglob("*.md") if not any(part.startswith(".") for part in path.parts) for pin in re.findall(r"repo-standard-kit(?:\.git)?(?:@|/(?:tree|blob)/)(v[\d.]+)", path.read_text())]
          assert pins and all(pin in kit_row for pin in pins), "kit pin drift"
          PYTHON

      # Chromium is ~150MB; without this every run re-downloads it.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(uv run python -c 'from importlib.metadata import version; print(version(\"playwright\"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        # --with-deps installs the system libraries Chromium needs, which the
        # cache does not cover, so it must run on a cache hit too.
        run: uv run playwright install --with-deps chromium

      # File hygiene. The fast content hook is skipped because the full
      # check runs below.
      - name: Run pre-commit
        env:
          SKIP: resume-gates
        run: uv run pre-commit run --all-files

      - name: Validate resume.json
        run: uv run resume validate

      - name: Check CV quality
        run: uv run resume check

      - name: Build the site
        run: uv run resume site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resume
          path: dist/
          if-no-files-found: error

      # Only main gets published; every other branch just proves it builds.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
