name: Quality

# Triggers match repo-standard-kit's quality workflow (push to main, every
# pull request). workflow_dispatch is a deliberate addition: it re-runs the
# gates and redeploys Pages from the Actions tab without a commit.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Superseded pull request runs are cancelled; main runs never are, because a
# newer push could otherwise cancel a Pages deploy half-way through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the colophon dates the CV from the last commit that
          # touched resume.json. The default shallow clone fetches one commit,
          # so that lookup would silently fall back to whatever HEAD is and
          # stamp every build with today's date -- wrong, and wrong quietly.
          fetch-depth: 0
          # Nothing pushes back, so the token need not stay in .git/config.
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # Chromium is ~150MB; without this every run re-downloads it. uv.lock
      # pins the Playwright version exactly, so it keys the browser build.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Chromium
        # --with-deps installs the system libraries Chromium needs, which the
        # cache does not cover, so it must run on a cache hit too.
        run: uv run playwright install --with-deps chromium

      # File hygiene, the toolkit pin check and the workflow linters. The fast
      # content hook is skipped because the full check runs below.
      - name: Run pre-commit
        env:
          SKIP: resume-gates
        run: uv run pre-commit run --all-files

      - name: Validate resume.json
        run: uv run resume validate

      - name: Check CV quality
        run: uv run resume check

      - name: Build the site
        run: uv run resume site

      # One download per run: site/ is exactly what Pages serves, and
      # all-versions/ adds the private cuts and Markdown that never deploy.
      - name: Build all versions
        run: |
          uv run resume build --out artifact/all-versions
          cp -R dist artifact/site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resume
          path: artifact/
          if-no-files-found: error

      # Only main gets published; every other branch just proves it builds.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub's Pages guidance: deploys queue, and none is cancelled mid-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # deploy-pages publishes the site
      id-token: write # deploy-pages authenticates to Pages with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
